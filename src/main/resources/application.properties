spring.application.name=quizportal-backend

server.port=8080

# Updated URL with your Aiven host, port, database name, and SSL parameters
spring.datasource.url=jdbc:mysql://mysql-2478345e-dileepkamineni.l.aivencloud.com:10302/quizportal_db?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=non_null

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
